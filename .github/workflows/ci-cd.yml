name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "No tests yet"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          script: |
            set -e

            # ────────────────────────────────────────────────
            # Navigate to project directory
            # ────────────────────────────────────────────────
            cd /home/aimanbatool114/Project_pipeline || { echo "Project directory not found!"; exit 1; }

            # ────────────────────────────────────────────────
            # Force sync with GitHub
            # ────────────────────────────────────────────────
            git fetch origin main || { echo "Git fetch failed"; exit 1; }
            git reset --hard origin/main || { echo "Git reset failed"; exit 1; }
            git clean -fd \
              --exclude=venv \
              --exclude=gcp-service-account.json \
              --exclude=uvicorn.pid \
              --exclude=uvicorn.log \
              --exclude=products.db \
              --exclude=filled_templates \
              --exclude=.env
            echo "✅ Code synced with GitHub"

            # ────────────────────────────────────────────────
            # Create venv if it doesn't exist
            # ────────────────────────────────────────────────
            if [ ! -f "venv/bin/activate" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv || { echo "Failed to create venv"; exit 1; }
              echo "✅ Virtual environment created"
            fi

            # ────────────────────────────────────────────────
            # Activate virtual environment and update deps
            # ────────────────────────────────────────────────
            source venv/bin/activate || { echo "Failed to activate virtualenv"; exit 1; }
            pip install --upgrade pip
            pip install -r requirements.txt || { echo "Failed to install dependencies"; exit 1; }
            echo "✅ Dependencies updated"

            # ────────────────────────────────────────────────
            # Write secrets to .env (fresh each deploy)
            # The systemd service reads this file via EnvironmentFile=
            # ────────────────────────────────────────────────
            cat > .env << 'ENVEOF'
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ZENROWS_API_KEY=${{ secrets.ZENROWS_API_KEY }}
            ENVEOF
            echo "✅ .env written"

            # Write GCP service account key
            echo '${{ secrets.GCP_SA_KEY }}' > gcp-service-account.json
            echo "✅ GCP credentials written"

            # ────────────────────────────────────────────────
            # Restart via systemd — this is the ONLY process
            # manager. No nohup, no PID files.
            # sudo is allowed passwordless for this command only
            # (see sudoers note below).
            # ────────────────────────────────────────────────
            sudo systemctl restart project-pipeline.service || { echo "systemctl restart failed"; exit 1; }
            sleep 3

            # ────────────────────────────────────────────────
            # Verify the service actually came up
            # ────────────────────────────────────────────────
            if sudo systemctl is-active --quiet project-pipeline.service; then
              echo "✅ Service is running"
            else
              echo "❌ Service failed to start — showing last 30 log lines:"
              sudo journalctl -u project-pipeline.service -n 30 --no-pager
              exit 1
            fi

            echo "✅ Deployment complete"
            echo "Logs: sudo journalctl -u project-pipeline.service -f"
